<title>MHDBDB · Nachtgarten</title>
<style>
/* Single-theme by design: an illuminated night garden. All colors explicit. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #150d11;
  color: #efe9d6;
  font-family: Georgia, 'Iowan Old Style', serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
canvas#glow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
.szene {
  position: fixed;
  inset: 0;
  display: none;
}
.szene.offen { display: block; }
.kopf {
  position: absolute;
  top: 5vh;
  width: 100%;
  text-align: center;
  pointer-events: none;
  z-index: 3;
}
.kopf h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 400;
  margin: 0;
  letter-spacing: .04em;
  text-shadow: 0 0 40px rgba(232,179,76,.35);
}
.kopf .sub {
  color: #9aa18f;
  font-size: clamp(.9rem, 2vw, 1.1rem);
  margin-top: .4rem;
  font-family: system-ui, sans-serif;
}
/* ---------- garden orbs ---------- */
.orb {
  position: absolute;
  transform: translate(-50%, -50%);
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .1em;
  color: #efe9d6;
  font-family: Georgia, serif;
  background: none;
  animation: floaty 7s ease-in-out infinite;
  transition: transform .4s ease;
}
.orb:hover, .orb:focus-visible { transform: translate(-50%, -50%) scale(1.07); outline: none; }
.orb:focus-visible canvas { outline: 2px solid #efe9d6; outline-offset: 4px; border-radius: 50%; }
.orb .wort { font-size: clamp(1rem, 2.2vw, 1.35rem); letter-spacing: .05em; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.orb .zahl { font-family: system-ui, sans-serif; font-size: .78rem; color: #9a8f96; letter-spacing: .08em; }
@keyframes floaty {
  0%, 100% { margin-top: 0; }
  50% { margin-top: -14px; }
}
.orb:nth-child(odd) { animation-duration: 9s; animation-delay: -3s; }
/* ---------- constellation ---------- */
#stern {
  background: radial-gradient(ellipse at 50% 115%, var(--halo, rgba(232,179,76,.18)), transparent 60%);
}
#konst {
  position: absolute;
  inset: 18vh 4vw 8vh;

}
#stern.fokus #konst { opacity: .18; pointer-events: none; }

  color: #efe9d6;
  font-family: Georgia, serif;

  flex-direction: column;
  align-items: center;
  gap: .7rem;

}
.licht:hover, .licht:focus-visible { transform: scale(1.12) rotate(0deg); outline: none; }
.licht canvas { display: block; }
.licht:focus-visible canvas { outline: 2px solid #efe9d6; outline-offset: 3px; border-radius: 50%; }

}
.licht.gesehen canvas { opacity: .45; filter: saturate(.4); }
/* ---------- focus overlay ---------- */
#lupe {

#gross {
  font-size: clamp(3rem, 10vw, 6rem);

}

<script>
const ROOMS = [

  ]},

    { w: 'Leuchten', s: 'Dein gesuchtes Wort leuchtet farbig im alten Text.', f: 'reading-view' },
    { w: 'Zählen', s: 'Alle Teile des Systems zählen die Wortpositionen exakt gleich.', f: 'position-parity' },
    { w: 'Merken', s: 'Ein gelesener Text ist beim zweiten Mal sofort wieder da.', f: 'tei-caching' },
  ]},
  { wort: 'Bedeutung', ico: '📚', c1: '#d9c184', c2: '#6e5c2c', halo: 'rgba(217,193,132,.4)', x: 50, y: 62, tests: [
    { w: 'Zuhause', s: 'Jedes Wort hat eine eigene Seite mit Fundstellen und Links.', f: 'lemma-page' },
    { w: 'Blättern', s: 'Von A bis Z, und jede Stelle hat eine merkbare Adresse.', f: 'woerterbuch' },

  ]},
  { wort: 'Spielsachen', ico: '🎲', c1: '#c88bb0', c2: '#5d3a52', halo: 'rgba(200,139,176,.35)', x: 22, y: 74, tests: [
    { w: 'Reime', s: 'gân reimt auf begân, muot auf guot.', f: 'rhyme-dictionary' },
    { w: 'Enden', s: 'Eine Zählung darüber, wie Verse aufhören.', f: 'verse-ending-profile' },
    { w: 'Namen', s: 'Wie Figuren in den Geschichten genannt werden, mit Belegen.', f: 'naming-explorer' },
    { w: 'Einmal', s: 'Wörter, die im ganzen Korpus nur ein einziges Mal vorkommen.', f: 'hapax-legomena' },

  ]},
  { wort: 'Treffer', ico: '📋', c1: '#a9b7c6', c2: '#46525e', halo: 'rgba(169,183,198,.3)', x: 84, y: 66, tests: [
    { w: 'Tabelle', s: 'Treffer als Liste oder Tabelle, sortierbar, mitnehmbar, gemerkt.', f: 'results-table' },
  ]},
  { wort: 'Fundament', ico: '🧱', c1: '#d4705b', c2: '#6e3126', halo: 'rgba(212,112,91,.4)', x: 55, y: 22, tests: [
    { w: 'Start', s: 'Die Startseite lädt ohne Fehler, die Suche geht sofort.', f: 'main-site' },
    { w: 'Fangen', s: 'Geht etwas schief, kommt eine Meldung, die Seite lebt weiter.', f: 'error-handling' },
    { w: 'Laden', s: 'Der Korpus mit allen Texten lädt zuverlässig.', f: 'corpus' },
    { w: '667', s: 'Alle 667 Texte kommen wirklich an.', f: 'playground-corpus' },
    { w: 'Werkstatt', s: 'Der Datenbereich startet mit allen Bausteinen.', f: 'playground' },
    { w: 'Register', s: 'Die großen Register laden schnell und vollständig.', f: 'playground-authority-index' },
    { w: 'Rahmen', s: 'Menü und Fußzeile funktionieren auf jeder Unterseite.', f: 'site-chrome' },
    { w: 'Daheim', s: 'Keine fremden Server, alle Bausteine liegen bei der Seite.', f: 'vendor' },
    { w: 'Handy', s: 'Auch auf Handy und Tablet gut bedienbar.', f: 'visual-mobile-test' },

  ]},
];

/* Formal structure of every spec as a three-station process:
   prepare → act → assert. Drawn as a vein the test flows through. */
const STEPS = {
  'search-engine': ['Wort tippen', 'Index befragen', 'Nächstes prüfen'],
  'search-normalization': ['Sonderzeichen rein', 'vereinfachen', 'Gleichheit prüfen'],
  'search-with-corpus': ['Suchart wählen', 'suchen', 'Treffer zählen'],
  'lemma-matching': ['Text laden', 'Wort markieren', 'exakt zählen'],
  'word-component-search': ['Wortteil tippen', 'Komposita sammeln', 'Gruppen prüfen'],
  'proximity-and-resolution': ['zwei Wörter', 'Abstand messen', 'Fenster prüfen'],
  'multi-lemma-verse': ['Vers-Modus an', 'minne + herze', 'Vers prüfen'],
  'cooccurrence-ranking': ['Doppelwort tippen', 'häufigstes wählen', 'Wechsel prüfen'],
  'lemma-occurrence-handoff': ['Liste anklicken', 'Kennung mitgeben', 'Ankunft prüfen'],
  'reading-view': ['Text öffnen', 'Wort markieren', 'Leuchten prüfen'],
  'position-parity': ['Python zählt', 'JavaScript zählt', 'Gleichstand prüfen'],
  'tei-caching': ['Text laden', 'erneut öffnen', 'Speicher prüfen'],
  'lemma-page': ['Seite laden', 'Daten prüfen', 'Links prüfen'],
  'woerterbuch': ['Buchstabe A', 'blättern', 'Adresse prüfen'],
  'cross-reference-test': ['Werk öffnen', 'Faden folgen', 'Ziel prüfen'],
  'rhyme-dictionary': ['Wort geben', 'Reime scannen', 'begân finden'],
  'verse-ending-profile': ['Korpus scannen', 'Endungen zählen', 'Tabelle prüfen'],
  'naming-explorer': ['Werk + Figur', 'Namen sammeln', 'Belege prüfen'],
  'hapax-legomena': ['Korpus zählen', 'Einzelne filtern', 'Fundort prüfen'],
  'concept-distribution': ['Begriff wählen', 'aggregieren', 'flüssig bleiben'],
  'results-table': ['suchen', 'Tabelle schalten', 'sortiert prüfen'],
  'main-site': ['Startseite laden', 'Konsole lauschen', 'still bleiben'],
  'error-handling': ['Fehler auslösen', 'Meldung prüfen', 'weiterleben'],
  'corpus': ['Korpus laden', 'Struktur prüfen', 'Fortschritt sehen'],
  'playground-corpus': ['Playground öffnen', '667 laden', 'Liste prüfen'],
  'playground': ['Seite öffnen', 'Module prüfen', 'Speicher leeren'],
  'playground-authority-index': ['Register laden', 'füllen', 'schnell bleiben'],
  'site-chrome': ['Unterseite öffnen', 'Menü prüfen', 'Fußzeile prüfen'],
  'vendor': ['Seiten scannen', 'Fremdes suchen', 'nichts finden'],
  'visual-mobile-test': ['Handy-Maß setzen', 'rendern', 'Berührung prüfen'],
  'normalization-parity': ['gleiche Wörter', 'beide vereinfachen', 'Gleichheit prüfen'],
};

function aderMalen(steps, c1, c2) {
  const cv2 = document.getElementById('ader');
  const dpr = 2, w = Math.min(innerWidth * .86, 620), h = 96;
  cv2.width = w * dpr; cv2.height = h * dpr;
  cv2.style.width = w + 'px'; cv2.style.height = h + 'px';
  const g = cv2.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const y0 = h * .42, pad = w * .08;
  const xs = steps.map((_, i) => pad + i * (w - 2 * pad) / (steps.length - 1));
  const ys = xs.map((_, i) => y0 + Math.sin(i * 2.1 + 1) * 9);
  /* the vein */
  g.beginPath();
  g.moveTo(xs[0] - pad * .6, ys[0] + 6);
  for (let i = 0; i < xs.length; i++) {
    const px = i ? (xs[i - 1] + xs[i]) / 2 : xs[i] - pad * .3;
    g.quadraticCurveTo(px, ys[i] + (i % 2 ? -14 : 14), xs[i], ys[i]);
  }
  g.lineTo(xs[xs.length - 1] + pad * .6, ys[ys.length - 1] - 4);
  const lg = g.createLinearGradient(0, 0, w, 0);
  lg.addColorStop(0, c2); lg.addColorStop(.5, c1); lg.addColorStop(1, c2);
  g.strokeStyle = lg;
  g.lineWidth = 5;
  g.lineCap = 'round';
  g.shadowColor = c1; g.shadowBlur = 14;
  g.stroke();
  g.shadowBlur = 0;
  /* stations */
  g.font = '13px system-ui, sans-serif';
  g.textAlign = 'center';
  steps.forEach((s, i) => {
    const kg = g.createRadialGradient(xs[i], ys[i], 0, xs[i], ys[i], 11);
    kg.addColorStop(0, '#fdf3ec'); kg.addColorStop(.55, c1); kg.addColorStop(1, c2);
    g.fillStyle = kg;
    g.beginPath(); g.arc(xs[i], ys[i], i === steps.length - 1 ? 12 : 9, 0, 7); g.fill();
    if (i === steps.length - 1) {
      g.fillStyle = '#3d1220';
      g.beginPath(); g.arc(xs[i], ys[i], 4.5, 0, 7); g.fill();
    }
    g.fillStyle = '#b9aeb4';
    g.fillText(s, xs[i], ys[i] + 32);
  });
}

const garten = document.getElementById('garten');
const stern = document.getElementById('stern');
const konst = document.getElementById('konst');
const punkte = document.getElementById('punkte');
let raum = null, idx = -1;

let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

/* A cell is the unit of this visual language: an organic membrane whose
   nuclei count exactly the tests it carries. Painting, but honest data. */
function zelle(size, c1, c2, kerne) {
  const dpr = 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * dpr;
  c.style.width = c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const m = size / 2, r = size * .36;
  const p1 = rnd() * 7, p2 = rnd() * 7;
  g.beginPath();
  for (let i = 0; i <= 90; i++) {
    const a = i / 90 * Math.PI * 2;
    const w = r * (1 + .09 * Math.sin(3 * a + p1) + .05 * Math.sin(7 * a + p2));
    const x = m + Math.cos(a) * w, y = m + Math.sin(a) * w;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
  const grad = g.createRadialGradient(m - r * .25, m - r * .3, r * .1, m, m, r * 1.15);
  grad.addColorStop(0, '#fdf3ec');
  grad.addColorStop(.45, c1);
  grad.addColorStop(1, c2);
  g.shadowColor = c1; g.shadowBlur = size * .16;
  g.fillStyle = grad;
  g.fill();
  g.shadowBlur = 0;
  g.lineWidth = 1.5;
  g.strokeStyle = c2;
  g.stroke();
  /* nuclei ring */
  const nr = kerne === 1 ? 0 : r * .5;
  for (let k = 0; k < kerne; k++) {
    const a = k / kerne * Math.PI * 2 + p1;
    const j = 1 + (rnd() - .5) * .25;
    const x = m + Math.cos(a) * nr * j, y = m + Math.sin(a) * nr * j;
    const kr = Math.max(2.5, r * (kerne === 1 ? .3 : .11));
    const kg = g.createRadialGradient(x, y, 0, x, y, kr);
    kg.addColorStop(0, '#3d1220');
    kg.addColorStop(1, '#6e2438');
    g.fillStyle = kg;
    g.beginPath(); g.arc(x, y, kr, 0, 7); g.fill();
  }
  return c;
}

for (const r of ROOMS) {
  const d = Math.round(78 + r.tests.length * 10);
  const b = document.createElement('button');
  b.className = 'orb';
  b.style.cssText = `--c1:${r.c1};--c2:${r.c2};--halo:${r.halo};left:${r.x}%;top:${r.y}%`;
  b.appendChild(zelle(d, r.c1, r.c2, r.tests.length));
  const w = document.createElement('span');
  w.className = 'wort'; w.textContent = r.wort;
  const z = document.createElement('span');
  z.className = 'zahl'; z.textContent = r.tests.length + (r.tests.length === 1 ? ' Test' : ' Tests');
  b.append(w, z);
  b.addEventListener('click', () => raumOeffnen(r));
  garten.appendChild(b);
}

function raumOeffnen(r) {
  raum = r; idx = -1;
  stern.style.setProperty('--c1', r.c1);
  stern.style.setProperty('--halo', r.halo);
  document.getElementById('stern-titel').textContent = r.wort;
  document.getElementById('stern-hinweis').textContent = `${r.tests.length} ${r.tests.length === 1 ? 'Licht' : 'Lichter'}`;
  konst.innerHTML = '';
  r.tests.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'licht';
    b.style.setProperty('--tilt', (rnd() * 6 - 3).toFixed(1) + 'deg');
    b.appendChild(zelle(38, r.c1, r.c2, 1));
    const w = document.createElement('span');
    w.className = 'ein-wort'; w.textContent = t.w;
    b.appendChild(w);
    b.addEventListener('click', () => fokus(i));
    konst.appendChild(b);
  });
  punkte.innerHTML = r.tests.map(() => '<i></i>').join('');
  punkte.style.display = 'none';
  stern.classList.remove('fokus');
  stern.classList.add('offen');
  garten.classList.remove('offen');
}
function fokus(i) {
  idx = i;
  const t = raum.tests[i];
  stern.classList.add('fokus');
  punkte.style.display = 'flex';
  const gross = document.getElementById('gross');
  const satz = document.getElementById('satz');
  for (const el of [gross, satz]) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
  gross.textContent = t.w;
  satz.textContent = t.s;
  aderMalen(STEPS[t.f] || ['öffnen', 'handeln', 'prüfen'], raum.c1, raum.c2);
  document.getElementById('spec').textContent = t.f + '.spec.js';
  [...punkte.children].forEach((p, k) => p.classList.toggle('jetzt', k === i));
  konst.children[i].classList.add('gesehen');
  document.getElementById('stern-hinweis').textContent = 'tippen für das nächste Licht';
}
function fokusZu() {
  stern.classList.remove('fokus');
  punkte.style.display = 'none';
  idx = -1;
  document.getElementById('stern-hinweis').textContent = `${raum.tests.length} ${raum.tests.length === 1 ? 'Licht' : 'Lichter'}`;
}
document.getElementById('lupe').addEventListener('click', () => {
  if (idx + 1 < raum.tests.length) fokus(idx + 1); else fokusZu();
});
document.getElementById('stern-zu').addEventListener('click', () => {
  if (stern.classList.contains('fokus')) return fokusZu();
  stern.classList.remove('offen');
  garten.classList.add('offen');
  raum = null;
});
addEventListener('keydown', e => {
  if (!raum) return;
  if (e.key === 'Escape') document.getElementById('stern-zu').click();
  if (idx >= 0 && (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight')) {
    if (idx + 1 < raum.tests.length) fokus(idx + 1); else fokusZu();
  }
  if (idx > 0 && e.key === 'ArrowLeft') fokus(idx - 1);
});

/* fireflies: one light per test, drifting slowly */
const cv = document.getElementById('glow');
const cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H;
function messen() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
messen(); addEventListener('resize', messen);
const flies = [];
for (const r of ROOMS) for (const t of r.tests) {
  flies.push({ x: rnd(), y: rnd(), p: rnd() * Math.PI * 2, v: .00012 + rnd() * .0002, c: r.c1 });
}
function malen(t) {
  cx.clearRect(0, 0, W, H);
  for (const f of flies) {
    const dx = still ? 0 : Math.sin(t * f.v + f.p) * .04;
    const dy = still ? 0 : Math.cos(t * f.v * .8 + f.p) * .04;
    const glow = still ? .5 : .35 + .35 * Math.sin(t * .001 + f.p * 5);
    const x = (f.x + dx) * W, y = (f.y + dy) * H;
    const g = cx.createRadialGradient(x, y, 0, x, y, 9);
    g.addColorStop(0, f.c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.globalAlpha = glow;
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, 9, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
  if (!still) requestAnimationFrame(malen);
}
requestAnimationFrame(malen);
</script>
