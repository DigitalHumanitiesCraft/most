<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHDBDB · Nachtgarten</title>
<style>
/* Single-theme by design: an illuminated night garden. All colors explicit. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #150d11;
  color: #efe9d6;
  font-family: Georgia, 'Iowan Old Style', serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
canvas#glow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
.szene {
  position: fixed;
  inset: 0;
  display: none;
}
.szene.offen { display: block; }
.kopf {
  position: absolute;
  top: 5vh;
  width: 100%;
  text-align: center;
  pointer-events: none;
  z-index: 3;
}
.kopf h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 400;
  margin: 0;
  letter-spacing: .04em;
  text-shadow: 0 0 40px rgba(232,179,76,.35);
}
.kopf .sub {
  color: #b7bda8;
  font-size: clamp(.9rem, 2vw, 1.1rem);
  margin-top: .4rem;
  font-family: system-ui, sans-serif;
}
/* ---------- garden orbs ---------- */
.orb {
  position: absolute;
  transform: translate(-50%, -50%);
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .1em;
  color: #efe9d6;
  font-family: Georgia, serif;
  background: none;
  padding: .4rem;
  transition: transform .4s ease;
  /* the drifting happens on the drawing only, the hitbox stays put */
}
.orb canvas { animation: floaty 7s ease-in-out infinite; }
.orb:hover, .orb:focus-visible { transform: translate(-50%, -50%) scale(1.07); outline: none; }
.orb:focus-visible canvas { outline: 2px solid #efe9d6; outline-offset: 4px; border-radius: 50%; }
.orb .wort { font-size: clamp(1rem, 2.2vw, 1.35rem); letter-spacing: .05em; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.orb .zahl { font-family: system-ui, sans-serif; font-size: .78rem; color: #b0a3aa; letter-spacing: .08em; }
@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.orb:nth-child(odd) canvas { animation-duration: 9s; animation-delay: -3s; }
/* ---------- constellation ---------- */
#stern {
  background: radial-gradient(ellipse at 50% 115%, var(--halo, rgba(232,179,76,.18)), transparent 60%);
}
#konst {
  position: absolute;
  inset: 19vh 5vw 15vh;
  z-index: 2;
  transition: opacity .5s;
}
#stern.fokus #konst { opacity: .1; pointer-events: none; }
/* The button is the hitbox and never moves. Everything that breathes
   lives in .schweb inside it, so the target stays where the eye aims. */
.licht {
  position: absolute;
  left: var(--px, 50%);
  top: var(--py, 50%);
  transform: translate(-50%, -50%);
  min-width: 44px;
  min-height: 44px;
  width: clamp(76px, 10vw, 132px);
  padding: .55rem .25rem;
  background: none;
  border: none;
  cursor: pointer;
  color: #efe9d6;
  font-family: Georgia, serif;
}
.licht:focus-visible { outline: none; }
.licht .schweb {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .55rem;
  transform: rotate(var(--tilt, 0deg));
  transition: transform .3s;
  animation: schweben var(--dur, 8s) ease-in-out infinite;
  animation-delay: var(--del, 0s);
}
@keyframes schweben {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -9px; }
}
.licht:hover .schweb, .licht:focus-visible .schweb { transform: scale(1.12) rotate(0deg); }
.licht canvas { display: block; }
.licht:focus-visible canvas { outline: 2px solid #efe9d6; outline-offset: 3px; border-radius: 50%; }
.licht .ein-wort {
  font-size: clamp(.95rem, 1.9vw, 1.3rem);
  line-height: 1.2;
  letter-spacing: .04em;
  text-shadow: 0 0 20px rgba(0,0,0,.85), 0 1px 4px rgba(0,0,0,.9);
  overflow-wrap: anywhere;
}
.licht.gesehen canvas { opacity: .45; filter: saturate(.4); }
/* ---------- focus overlay ---------- */
#lupe {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12vh 6vw 24vh;
  cursor: pointer;
  /* scrim: keeps the vein diagram off the dimmed constellation behind it */
  background: radial-gradient(ellipse at 50% 45%, rgba(21,13,17,.96) 0%, rgba(21,13,17,.92) 55%, rgba(21,13,17,.72) 100%);
}
#stern.fokus #lupe { display: flex; }
#gross {
  font-size: clamp(3rem, 10vw, 6rem);
  line-height: 1.05;
  margin: 0;
  text-shadow: 0 0 70px var(--c1, rgba(232,179,76,.8));
  animation: auftauchen .7s ease both;
}
#satz {
  font-size: clamp(1.3rem, 3.4vw, 2rem);
  line-height: 1.45;
  max-width: 26ch;
  text-wrap: balance;
  margin: 2.2rem 0 0;
  color: #d8d2bd;
  animation: auftauchen .7s .15s ease both;
}
#ader { position: relative; z-index: 1; margin-top: 1.8rem; max-width: 92vw; animation: auftauchen .7s .3s ease both; }
#spec {
  margin-top: 1.2rem;
  font-family: ui-monospace, monospace;
  font-size: .8rem;
  color: #9aa190;
  letter-spacing: .05em;
}
@keyframes auftauchen {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
#punkte {
  position: absolute;
  bottom: 7vh;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 92vw;
  gap: 0;
  z-index: 5;
  pointer-events: none;
}
#punkte button {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  background: none;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  pointer-events: auto;
}
#punkte button i {
  display: block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #5d6755;
  transition: background .4s, box-shadow .4s, transform .3s;
}
#punkte button:hover i, #punkte button:focus-visible i { transform: scale(1.5); background: #b7bda8; }
#punkte button:focus-visible { outline: 2px solid #efe9d6; }
#punkte button.jetzt i { background: var(--c1, #e8b34c); box-shadow: 0 0 12px var(--c1, #e8b34c); }
.hinweis {
  position: absolute;
  bottom: 2.5vh;
  width: 100%;
  text-align: center;
  font-family: system-ui, sans-serif;
  font-size: .9rem;
  color: #c2c7b3;
  pointer-events: none;
  z-index: 5;
}
.zu {
  position: absolute;
  top: 4vh;
  right: 5vw;
  font-size: 2rem;
  color: #c2c7b3;
  background: none;
  border: none;
  cursor: pointer;
  font-family: Georgia, serif;
  z-index: 6;
}
.zu:focus-visible { outline: 2px solid #efe9d6; border-radius: 50%; }
/* The state of a run is never carried by color or shape alone: a fallen test
   keeps its light, loses its halo and says so in words. */
.orb .stand, .licht .stand {
  font-family: system-ui, sans-serif;
  font-size: .76rem;
  letter-spacing: .04em;
  color: #d8d2bd;
  text-shadow: 0 0 14px rgba(0,0,0,.9);
}
@media (prefers-reduced-motion: reduce) {
  .orb canvas, .licht .schweb, #gross, #satz, #ader { animation: none; }
}
</style>
</head>
<body>

<canvas id="glow"></canvas>

<div id="garten" class="szene offen">
  <div class="kopf">
    <h1>Die MHDBDB</h1>
    <p class="sub" id="garten-sub"></p>
  </div>
</div>

<div id="stern" class="szene">
  <div class="kopf">
    <h1 id="stern-titel"></h1>
    <p class="sub">jede Zelle ein Test · antippen zum Näherkommen</p>
  </div>
  <button class="zu" id="stern-zu" aria-label="zurück zum Garten">✕</button>
  <div id="konst"></div>
  <div id="lupe" aria-live="polite">
    <p id="gross"></p>
    <p id="satz"></p>
    <canvas id="ader"></canvas>
    <p id="spec"></p>
  </div>
  <div id="punkte"></div>
  <p class="hinweis" id="stern-hinweis"></p>
</div>

<script type="module">
import { datenLaden, laufLaden, lauf, stand, standWort, laufDatum } from './helio.js';

/* Categories, tests, their colors and garden positions come from
   daten/mhdbdb.json, written by hand from the Playwright spec files of the
   MHDBDB suite; the page carries no copy. */
const daten = await datenLaden('daten/mhdbdb.json');
const ROOMS = daten ? daten.kategorien : [];
const STEPS = daten ? daten.stufen : {};

/* daten/testlauf.json is written by scripts/testlauf-ingest.mjs from a real
   Playwright run. Without the file the garden claims no state at all. */
await laufLaden('daten/testlauf.json');

function aderMalen(steps, c1, c2) {
  const cv2 = document.getElementById('ader');
  const dpr = 2, w = Math.min(innerWidth * .86, 620), h = 96;
  cv2.width = w * dpr; cv2.height = h * dpr;
  cv2.style.width = w + 'px'; cv2.style.height = h + 'px';
  const g = cv2.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const y0 = h * .42, pad = w * .08;
  const xs = steps.map((_, i) => pad + i * (w - 2 * pad) / (steps.length - 1));
  const ys = xs.map((_, i) => y0 + Math.sin(i * 2.1 + 1) * 9);
  /* the vein */
  g.beginPath();
  g.moveTo(xs[0] - pad * .6, ys[0] + 6);
  for (let i = 0; i < xs.length; i++) {
    const px = i ? (xs[i - 1] + xs[i]) / 2 : xs[i] - pad * .3;
    g.quadraticCurveTo(px, ys[i] + (i % 2 ? -14 : 14), xs[i], ys[i]);
  }
  g.lineTo(xs[xs.length - 1] + pad * .6, ys[ys.length - 1] - 4);
  const lg = g.createLinearGradient(0, 0, w, 0);
  lg.addColorStop(0, c2); lg.addColorStop(.5, c1); lg.addColorStop(1, c2);
  g.strokeStyle = lg;
  g.lineWidth = 5;
  g.lineCap = 'round';
  g.shadowColor = c1; g.shadowBlur = 14;
  g.stroke();
  g.shadowBlur = 0;
  /* stations */
  g.font = '13px system-ui, sans-serif';
  g.textAlign = 'center';
  steps.forEach((s, i) => {
    const kg = g.createRadialGradient(xs[i], ys[i], 0, xs[i], ys[i], 11);
    kg.addColorStop(0, '#fdf3ec'); kg.addColorStop(.55, c1); kg.addColorStop(1, c2);
    g.fillStyle = kg;
    g.beginPath(); g.arc(xs[i], ys[i], i === steps.length - 1 ? 12 : 9, 0, 7); g.fill();
    if (i === steps.length - 1) {
      g.fillStyle = '#3d1220';
      g.beginPath(); g.arc(xs[i], ys[i], 4.5, 0, 7); g.fill();
    }
    g.fillStyle = '#b9aeb4';
    g.fillText(s, xs[i], ys[i] + 32);
  });
}

const garten = document.getElementById('garten');
const stern = document.getElementById('stern');
const konst = document.getElementById('konst');
const punkte = document.getElementById('punkte');
let raum = null, idx = -1;

let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

/* A cell is the unit of this visual language: an organic membrane whose
   nuclei count exactly the tests it carries. Painting, but honest data. */
function zelle(size, c1, c2, kerne) {
  const dpr = 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * dpr;
  c.style.width = c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const m = size / 2, r = size * .36;
  const p1 = rnd() * 7, p2 = rnd() * 7;
  g.beginPath();
  for (let i = 0; i <= 90; i++) {
    const a = i / 90 * Math.PI * 2;
    const w = r * (1 + .09 * Math.sin(3 * a + p1) + .05 * Math.sin(7 * a + p2));
    const x = m + Math.cos(a) * w, y = m + Math.sin(a) * w;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
  const grad = g.createRadialGradient(m - r * .25, m - r * .3, r * .1, m, m, r * 1.15);
  grad.addColorStop(0, '#fdf3ec');
  grad.addColorStop(.45, c1);
  grad.addColorStop(1, c2);
  g.shadowColor = c1; g.shadowBlur = size * .16;
  g.fillStyle = grad;
  g.fill();
  g.shadowBlur = 0;
  g.lineWidth = 1.5;
  g.strokeStyle = c2;
  g.stroke();
  /* nuclei ring */
  const nr = kerne === 1 ? 0 : r * .5;
  for (let k = 0; k < kerne; k++) {
    const a = k / kerne * Math.PI * 2 + p1;
    const j = 1 + (rnd() - .5) * .25;
    const x = m + Math.cos(a) * nr * j, y = m + Math.sin(a) * nr * j;
    const kr = Math.max(2.5, r * (kerne === 1 ? .3 : .11));
    const kg = g.createRadialGradient(x, y, 0, x, y, kr);
    kg.addColorStop(0, '#3d1220');
    kg.addColorStop(1, '#6e2438');
    g.fillStyle = kg;
    g.beginPath(); g.arc(x, y, kr, 0, 7); g.fill();
  }
  return c;
}

for (const r of ROOMS) {
  const d = Math.round(78 + r.tests.length * 10);
  const b = document.createElement('button');
  b.className = 'orb';
  b.style.cssText = `--c1:${r.c1};--c2:${r.c2};--halo:${r.halo};left:${r.x}%;top:${r.y}%`;
  b.appendChild(zelle(d, r.c1, r.c2, r.tests.length));
  const w = document.createElement('span');
  w.className = 'wort'; w.textContent = r.wort;
  const z = document.createElement('span');
  z.className = 'zahl'; z.textContent = r.tests.length + (r.tests.length === 1 ? ' Test' : ' Tests');
  b.append(w, z);
  b.addEventListener('click', () => raumOeffnen(r));
  garten.appendChild(b);
}

/* Constellation layout: a jittered grid. The grid guarantees the hitboxes
   never overlap, the seeded jitter breaks up the row. */
function konstellation(n) {
  const cols = Math.min(n, Math.ceil(Math.sqrt(n * 1.7)));
  const rows = Math.ceil(n / cols);
  const cw = 100 / cols, ch = 100 / rows;
  const jx = cw * .17, jy = ch * .15;
  const out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / cols), col = i % cols;
    const inRow = Math.min(cols, n - row * cols);
    const shift = (cols - inRow) / 2;
    out.push({
      x: (col + shift + .5) * cw + (rnd() * 2 - 1) * jx,
      y: (row + .5) * ch + (rnd() * 2 - 1) * jy,
    });
  }
  return out;
}

function raumOeffnen(r) {
  raum = r; idx = -1;
  stern.style.setProperty('--c1', r.c1);
  stern.style.setProperty('--halo', r.halo);
  document.getElementById('stern-titel').textContent = r.wort;
  document.getElementById('stern-hinweis').textContent = `${r.tests.length} ${r.tests.length === 1 ? 'Licht' : 'Lichter'}`;
  konst.innerHTML = '';
  const orte = konstellation(r.tests.length);
  r.tests.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'licht';
    b.type = 'button';
    b.style.setProperty('--px', orte[i].x.toFixed(2) + '%');
    b.style.setProperty('--py', orte[i].y.toFixed(2) + '%');
    const s = document.createElement('span');
    s.className = 'schweb';
    s.style.setProperty('--tilt', (rnd() * 6 - 3).toFixed(1) + 'deg');
    s.style.setProperty('--dur', (7 + rnd() * 4).toFixed(1) + 's');
    s.style.setProperty('--del', (-rnd() * 6).toFixed(1) + 's');
    s.appendChild(zelle(38, r.c1, r.c2, 1));
    const w = document.createElement('span');
    w.className = 'ein-wort'; w.textContent = t.w;
    s.appendChild(w);
    b.appendChild(s);
    b.addEventListener('click', () => fokus(i));
    konst.appendChild(b);
  });
  punkte.innerHTML = '';
  r.tests.forEach((t, i) => {
    const p = document.createElement('button');
    p.type = 'button';
    p.setAttribute('aria-label', `Licht ${i + 1} von ${r.tests.length}: ${t.w}`);
    p.appendChild(document.createElement('i'));
    p.addEventListener('click', () => fokus(i));
    punkte.appendChild(p);
  });
  punkte.style.display = 'none';
  stern.classList.remove('fokus');
  konst.inert = false;
  stern.classList.add('offen');
  garten.classList.remove('offen');
}
function fokus(i) {
  idx = i;
  const t = raum.tests[i];
  stern.classList.add('fokus');
  konst.inert = true;
  punkte.style.display = 'flex';
  const gross = document.getElementById('gross');
  const satz = document.getElementById('satz');
  for (const el of [gross, satz]) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
  gross.textContent = t.w;
  satz.textContent = t.s;
  aderMalen(STEPS[t.f] || ['öffnen', 'handeln', 'prüfen'], raum.c1, raum.c2);
  document.getElementById('spec').textContent = t.f + '.spec.js';
  [...punkte.children].forEach((p, k) => {
    p.classList.toggle('jetzt', k === i);
    if (k === i) p.setAttribute('aria-current', 'true'); else p.removeAttribute('aria-current');
  });
  konst.children[i].classList.add('gesehen');
  document.getElementById('stern-hinweis').textContent = 'tippen für das nächste Licht · Punkte springen direkt · ← →';
}
function fokusZu() {
  stern.classList.remove('fokus');
  konst.inert = false;
  punkte.style.display = 'none';
  idx = -1;
  document.getElementById('stern-hinweis').textContent = `${raum.tests.length} ${raum.tests.length === 1 ? 'Licht' : 'Lichter'}`;
}
document.getElementById('lupe').addEventListener('click', () => {
  if (idx + 1 < raum.tests.length) fokus(idx + 1); else fokusZu();
});
document.getElementById('stern-zu').addEventListener('click', () => {
  if (stern.classList.contains('fokus')) return fokusZu();
  stern.classList.remove('offen');
  garten.classList.add('offen');
  raum = null;
});
addEventListener('keydown', e => {
  if (!raum) return;
  if (e.key === 'Escape') document.getElementById('stern-zu').click();
  /* let a focused button handle its own activation instead of advancing twice */
  const aufButton = e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter');
  if (idx >= 0 && !aufButton && (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight')) {
    if (idx + 1 < raum.tests.length) fokus(idx + 1); else fokusZu();
  }
  if (idx > 0 && e.key === 'ArrowLeft') fokus(idx - 1);
});

/* fireflies: one light per test, drifting slowly */
const cv = document.getElementById('glow');
const cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H;
function messen() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
messen(); addEventListener('resize', messen);
const flies = [];
for (const r of ROOMS) for (const t of r.tests) {
  flies.push({ x: rnd(), y: rnd(), p: rnd() * Math.PI * 2, v: .00012 + rnd() * .0002, c: r.c1 });
}
function malen(t) {
  cx.clearRect(0, 0, W, H);
  for (const f of flies) {
    const dx = still ? 0 : Math.sin(t * f.v + f.p) * .04;
    const dy = still ? 0 : Math.cos(t * f.v * .8 + f.p) * .04;
    const glow = still ? .5 : .35 + .35 * Math.sin(t * .001 + f.p * 5);
    const x = (f.x + dx) * W, y = (f.y + dy) * H;
    const g = cx.createRadialGradient(x, y, 0, x, y, 9);
    g.addColorStop(0, f.c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.globalAlpha = glow;
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, 9, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
  if (!still) requestAnimationFrame(malen);
}
requestAnimationFrame(malen);
</script>
<a href="index.html" style="position:fixed;top:10px;left:14px;z-index:99;font-family:system-ui,sans-serif;font-size:.85rem;color:#c2c7b3;text-decoration:none;padding:10px 12px;min-height:44px;display:flex;align-items:center;">&#8592; &#220;bersicht</a>
