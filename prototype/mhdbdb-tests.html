<title>MHDBDB · Nachtgarten</title>
<style>
/* Single-theme by design: an illuminated night garden. All colors explicit. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #10140d;
  color: #efe9d6;
  font-family: Georgia, 'Iowan Old Style', serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
canvas#glow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
/* ---------- home ---------- */
#home {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: block;
}
#home header {
  position: absolute;
  top: 6vh;
  width: 100%;
  text-align: center;
  pointer-events: none;
}
#home h1 {
  font-size: clamp(2rem, 6vw, 3.4rem);
  font-weight: 400;
  margin: 0;
  letter-spacing: .04em;
  text-shadow: 0 0 40px rgba(232,179,76,.35);
}
#home .sub {
  color: #9aa18f;
  font-size: clamp(.95rem, 2.2vw, 1.15rem);
  margin-top: .5rem;
  font-family: system-ui, sans-serif;
}
.orb {
  position: absolute;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .2em;
  color: #efe9d6;
  font-family: Georgia, serif;
  background: radial-gradient(circle at 38% 32%, var(--c1), var(--c2) 70%);
  box-shadow: 0 0 60px var(--halo), inset 0 0 30px rgba(0,0,0,.35);
  animation: floaty 7s ease-in-out infinite;
  transition: transform .4s ease;
}
.orb:hover, .orb:focus-visible { transform: translate(-50%, -50%) scale(1.07); outline: none; }
.orb:focus-visible { box-shadow: 0 0 0 3px #efe9d6, 0 0 60px var(--halo); }
.orb .ico { font-size: calc(var(--d) * .32); line-height: 1; filter: drop-shadow(0 0 12px rgba(0,0,0,.5)); }
.orb .wort { font-size: calc(var(--d) * .13); letter-spacing: .05em; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
@keyframes floaty {
  0%, 100% { margin-top: 0; }
  50% { margin-top: -14px; }
}
.orb:nth-child(odd) { animation-duration: 9s; animation-delay: -3s; }
/* ---------- room ---------- */
#room {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  padding: 8vh 6vw;
  background: radial-gradient(ellipse at 50% 110%, var(--halo, rgba(232,179,76,.2)), transparent 60%);
}
#room.offen { display: flex; }
#room .wo {
  position: absolute;
  top: 5vh;
  font-family: system-ui, sans-serif;
  font-size: 1rem;
  color: #9aa18f;
  letter-spacing: .12em;
  text-transform: uppercase;
}
#fakt {
  font-size: clamp(2rem, 6.5vw, 4rem);
  line-height: 1.25;
  max-width: 18ch;
  text-wrap: balance;
  margin: 0;
  text-shadow: 0 0 60px var(--halo, rgba(232,179,76,.4));
  animation: auftauchen .9s ease both;
}
@keyframes auftauchen {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
#punkte {
  position: absolute;
  bottom: 9vh;
  display: flex;
  gap: 1rem;
}
#punkte i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #3a4235;
  box-shadow: none;
  transition: background .4s, box-shadow .4s;
}
#punkte i.jetzt { background: var(--c1, #e8b34c); box-shadow: 0 0 14px var(--c1, #e8b34c); }
#hinweis {
  position: absolute;
  bottom: 4vh;
  font-family: system-ui, sans-serif;
  font-size: .85rem;
  color: #6b7261;
}
#zu {
  position: absolute;
  top: 4vh;
  right: 5vw;
  font-size: 2rem;
  color: #9aa18f;
  background: none;
  border: none;
  cursor: pointer;
  font-family: Georgia, serif;
}
#zu:focus-visible { outline: 2px solid #efe9d6; border-radius: 50%; }
@media (prefers-reduced-motion: reduce) {
  .orb { animation: none; }
  #fakt { animation: none; }
}
</style>

<canvas id="glow"></canvas>

<div id="home">
  <header>
    <h1>Die MHDBDB</h1>
    <p class="sub">Ein Garten aus alten Wörtern. 31 Lichter passen auf.</p>
  </header>
</div>

<div id="room" aria-live="polite">
  <span class="wo" id="wo"></span>
  <button id="zu" aria-label="zurück zum Garten">✕</button>
  <p id="fakt"></p>
  <div id="punkte"></div>
  <span id="hinweis">tippen für den nächsten Gedanken</span>
</div>

<script>
const ROOMS = [
  { wort: 'Suchen', ico: '🔍', c1: '#e8b34c', c2: '#7a5a1e', halo: 'rgba(232,179,76,.45)', x: 26, y: 40, tests: 9,
    fakten: ['Du tippst brot.\nSie findet brôt.', 'Sechs Sucharten.\nAlle liefern.', 'wein findet\nalle Weinwörter.', 'minne und herze\nim selben Vers.', 'Ein Wort doppelt?\nSie nimmt das häufigere.'] },
  { wort: 'Lesen', ico: '📖', c1: '#8fb083', c2: '#39543a', halo: 'rgba(143,176,131,.4)', x: 72, y: 34, tests: 3,
    fakten: ['667 alte Texte.', 'Dein Wort leuchtet\nim Text.', 'Gelesenes bleibt.\nSofort wieder da.'] },
  { wort: 'Bedeutung', ico: '📚', c1: '#d9c184', c2: '#6e5c2c', halo: 'rgba(217,193,132,.4)', x: 50, y: 62, tests: 3,
    fakten: ['Jedes Wort\nhat ein Zuhause.', 'Blättern\nvon A bis Z.', 'Alles ist\nverbunden.'] },
  { wort: 'Spielsachen', ico: '🎲', c1: '#c88bb0', c2: '#5d3a52', halo: 'rgba(200,139,176,.35)', x: 22, y: 74, tests: 5,
    fakten: ['gân reimt\nauf begân.', 'Wie enden Verse?\nEs zählt mit.', 'Wie heißen\ndie Figuren wirklich?', 'Wörter, die nur\neinmal existieren.'] },
  { wort: 'Treffer', ico: '📋', c1: '#a9b7c6', c2: '#46525e', halo: 'rgba(169,183,198,.3)', x: 84, y: 66, tests: 1,
    fakten: ['Liste oder Tabelle.\nDeine Wahl bleibt.'] },
  { wort: 'Fundament', ico: '🧱', c1: '#d4705b', c2: '#6e3126', halo: 'rgba(212,112,91,.4)', x: 55, y: 22, tests: 10,
    fakten: ['Fehler?\nEine Meldung. Kein Absturz.', 'Keine fremden Server.', 'Auch am Handy.', 'Zwei Zähler,\nexakt gleiches Ergebnis.'] },
];

const home = document.getElementById('home');
const room = document.getElementById('room');
const fakt = document.getElementById('fakt');
const punkte = document.getElementById('punkte');
const wo = document.getElementById('wo');
let aktiv = null, idx = 0;

for (const r of ROOMS) {
  const d = Math.round(90 + r.tests * 9);
  const b = document.createElement('button');
  b.className = 'orb';
  b.style.cssText = `--c1:${r.c1};--c2:${r.c2};--halo:${r.halo};--d:${d}px;width:${d}px;height:${d}px;left:${r.x}%;top:${r.y}%`;
  b.innerHTML = `<span class="ico">${r.ico}</span><span class="wort">${r.wort}</span>`;
  b.addEventListener('click', () => oeffnen(r));
  home.appendChild(b);
}

function oeffnen(r) {
  aktiv = r; idx = 0;
  room.style.setProperty('--c1', r.c1);
  room.style.setProperty('--halo', r.halo);
  wo.textContent = `${r.ico} ${r.wort} · ${r.tests} Lichter`;
  punkte.innerHTML = r.fakten.map(() => '<i></i>').join('');
  room.classList.add('offen');
  home.style.display = 'none';
  zeigen();
}
function zeigen() {
  fakt.style.animation = 'none';
  void fakt.offsetWidth;
  fakt.style.animation = '';
  fakt.textContent = aktiv.fakten[idx];
  [...punkte.children].forEach((p, i) => p.classList.toggle('jetzt', i === idx));
}
function weiter() {
  idx++;
  if (idx >= aktiv.fakten.length) return schliessen();
  zeigen();
}
function schliessen() {
  room.classList.remove('offen');
  home.style.display = 'block';
  aktiv = null;
}
room.addEventListener('click', e => { if (e.target.id !== 'zu') weiter(); });
document.getElementById('zu').addEventListener('click', schliessen);
addEventListener('keydown', e => {
  if (!aktiv) return;
  if (e.key === 'Escape') schliessen();
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') weiter();
});

/* fireflies: one light per test file, drifting slowly */
const cv = document.getElementById('glow');
const cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H;
function messen() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
messen(); addEventListener('resize', messen);
const flies = [];
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
for (const r of ROOMS) for (let i = 0; i < r.tests; i++) {
  flies.push({ x: rnd() * 1, y: rnd() * 1, p: rnd() * Math.PI * 2, v: .00012 + rnd() * .0002, c: r.c1 });
}
function malen(t) {
  cx.clearRect(0, 0, W, H);
  for (const f of flies) {
    const dx = still ? 0 : Math.sin(t * f.v + f.p) * .04;
    const dy = still ? 0 : Math.cos(t * f.v * .8 + f.p) * .04;
    const glow = still ? .5 : .35 + .35 * Math.sin(t * .001 + f.p * 5);
    const x = (f.x + dx) * W, y = (f.y + dy) * H;
    const g = cx.createRadialGradient(x, y, 0, x, y, 9);
    g.addColorStop(0, f.c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.globalAlpha = glow;
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, 9, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
  if (!still) requestAnimationFrame(malen);
}
requestAnimationFrame(malen);
</script>
