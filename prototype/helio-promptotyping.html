<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptotyping · Helio</title>
<link rel="stylesheet" href="helio.css">
<style>
/* page-specific: the disc stage, the quiet mono labels and the focus view.
   Colors, grain layering and the way back come from helio.css. */
html { overflow-x: hidden; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--grund-oben) 0%, var(--grund-unten) 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}
.nur-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

#buehne { position: relative; width: 100%; }
#motiv { position: absolute; }
#griffe { position: absolute; inset: 0; }

/* quiet text of this page: small, calm, same ink */
.mono {
  font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
  font-size: .72rem;
  letter-spacing: .09em;
  text-transform: uppercase;
  line-height: 1.7;
}
#kopf {
  /* left offset clears the fixed home link */
  position: absolute; top: 1.4rem; left: calc(14px + 8.2rem); right: 4vw;
  display: flex; justify-content: space-between; gap: 2rem;
  pointer-events: none; z-index: 4;
}
#kopf .marke { opacity: .85; }
#legende { text-align: right; opacity: .8; }
#legende span { display: block; white-space: nowrap; }
#unterzeile {
  display: block; margin: .5rem 0 0; max-width: 34ch;
  opacity: .8; text-transform: none; letter-spacing: .04em; font-size: .74rem;
}

/* Hitboxes: static, never smaller than 44px, invisible until focused. */
.band {
  position: absolute;
  background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer;
  color: var(--tinte);
  display: block;
}
.band:focus-visible { outline: 2px solid var(--tinte); outline-offset: -2px; }

/* Focus view, below the grain layer so the whole surface stays one print. */
#fokus {
  position: fixed; inset: 0; z-index: 30;
  display: none; flex-direction: column; justify-content: center;
  padding: 8vh 6vw 10vh;
  background: linear-gradient(180deg, var(--grund-oben) 0%, var(--grund-unten) 100%);
  overflow: hidden;
}
#fokus.offen { display: flex; }
#wort {
  font-size: 6rem;
  font-weight: 900;
  letter-spacing: -.045em;
  line-height: .84;
  margin: 0 0 1.6rem;
  margin-left: -.06em;
  text-transform: uppercase;
}
#satz {
  font-size: clamp(1.15rem, 2.6vw, 1.6rem);
  font-weight: 600;
  line-height: 1.45; margin: 0 0 1.8rem; max-width: 42ch; text-wrap: balance;
}
#mini {
  /* formal miniature: where this band sits in the disc */
  position: absolute; right: 6vw; bottom: 10vh;
  width: 170px; height: 170px;
}
@media (max-width: 700px) { #mini { display: none; } }
#zahlen { margin: 0 0 .7rem; opacity: .85; }
#auszug {
  margin: 0; max-width: 46ch; font-size: .84rem; line-height: 1.6;
  letter-spacing: .02em; text-transform: none; opacity: .95;
  border-top: 1px solid rgba(239, 234, 226, .45);
  padding-top: .7rem;
}
#zurueck-fokus {
  position: absolute; top: 1.4rem; right: 4vw;
  min-height: 44px; padding: .6rem 1.1rem;
  background: none; color: var(--tinte);
  border: 1px solid rgba(239, 234, 226, .55);
  cursor: pointer;
}
#steuerung {
  position: absolute; bottom: 1.4rem; left: 6vw; right: 6vw;
  opacity: .72; pointer-events: none;
}
#zurueck-fokus:focus-visible, #fokus:focus-visible { outline: 2px solid var(--tinte); outline-offset: 3px; }

@media (max-width: 620px) {
  #legende { display: none; }
  #unterzeile { font-size: .72rem; }
}
</style>
</head>
<body>

<a class="heim" href="index.html">&#8592; &#220;bersicht</a>

<h1 class="nur-sr">Promptotyping, die Wissensbasis als Sonnenscheibe</h1>

<div id="buehne">
  <canvas id="motiv" aria-hidden="true"></canvas>

  <div id="kopf" class="mono">
    <span class="marke">
      <span id="unterzeile" class="mono"></span>
    </span>
    <span id="legende">
      <span>Bandstärke · Umfang</span>
      <span>Welle · Status</span>
      <span>Schnitt · Regeln</span>
    </span>
  </div>

  <div id="griffe"></div>

</div>

<div id="fokus" role="dialog" aria-modal="true" aria-labelledby="wort" tabindex="-1">
  <p id="wort"></p>
  <p id="satz"></p>
  <p id="zahlen" class="mono"></p>
  <p id="auszug" class="mono"></p>
  <canvas id="mini" width="170" height="170" aria-hidden="true"></canvas>
  <button id="zurueck-fokus" class="mono" type="button" aria-label="Zurück zur Sonnenscheibe">Zurück (Esc)</button>
  <p id="steuerung" class="mono">Pfeiltasten wechseln das Dokument</p>
</div>

<canvas id="korn" aria-hidden="true"></canvas>

<script type="module">
import {
  TINTE, stillGestellt as still, messen, kornBauen, kornWeiter, kornFuellen, datenLaden,
} from './helio.js';

/* The knowledge base is read from the real folder by scripts/promptotyping-ingest.mjs;
   the page carries no copy. Every band is one document, its ink height the volume,
   its wave the state. Nothing is drawn that the source does not carry. */
const daten = await datenLaden('daten/promptotyping.json');
const DOKUMENTE = daten ? daten.dokumente : [];
const BAENDER = DOKUMENTE.filter(d => d.art !== 'regel');
const REGEL = DOKUMENTE.find(d => d.art === 'regel') || null;
const REIHENFOLGE = REGEL ? BAENDER.concat([REGEL]) : BAENDER;

document.getElementById('unterzeile').textContent = BAENDER.length
  ? BAENDER.length + ' Wissensdokumente als Bänder einer Sonne. Eines antippen.'
  : 'Keine Daten geladen.';

const buehne = document.getElementById('buehne');
const griffe = document.getElementById('griffe');
const motiv = document.getElementById('motiv');
const mx = motiv.getContext('2d');
const kc = document.getElementById('korn'), kg = kc.getContext('2d');
/* offscreen context, used only to measure display type before it is set */
const mess = document.createElement('canvas').getContext('2d');

/* Band ink height carries the volume of a document, sqrt of line count. */
function tinte(d) {
  const w = Math.sqrt(d.zeilen || 100);
  return 5 + Math.max(0, Math.min(1, (w - 10) / 43)) * 30;
}
/* Wave amplitude carries the state: what still moves, moves visibly.
   A document without a status in its front matter gets the neutral value. */
const AMPL = { complete: 2.5, active: 7, draft: 10, snapshot: 1 };

let W = 0, H = 0, dpr = 1, mass = null, phase = 0, aktiv = -1;
let KW = 0, KH = 0;

function messenHier() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = buehne.clientWidth;
  H = Math.max(innerHeight, 870);
  buehne.style.height = H + 'px';
  motiv.width = Math.round(W * dpr);
  motiv.height = Math.round(H * dpr);
  motiv.style.width = W + 'px';
  motiv.style.height = H + 'px';
  mx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ({ W: KW, H: KH } = messen([[kc, kg]]));

  if (!BAENDER.length) { mass = null; return; }
  const horizont = H * 0.755;
  const oben = H * 0.145;
  const platz = horizont - oben;
  const roh = BAENDER.map(d => Math.max(44, tinte(d) + 18));
  const summe = roh.reduce((a, b) => a + b, 0);
  const f = platz / summe;
  let y = oben;
  const reihen = BAENDER.map((d, i) => {
    const fach = roh[i] * f;
    const h = tinte(d);
    const r = { d, fachOben: y, fachHoehe: fach, h, y: y + (fach - h) / 2 };
    y += fach;
    return r;
  });
  const R = platz / 1.6;
  /* on narrow viewports the disc is squashed instead of cut away entirely,
     so its curvature stays readable while the hitboxes keep their height */
  const rx = Math.min(R, W * 0.47);
  mass = { horizont, oben, platz, reihen, R, rx, cx: W * 0.5, cy: horizont - 0.6 * R };
  griffeBauen();
  malen();
}

function halbBreite(y) {
  const dy = (y - mass.cy) / mass.R;
  const q = 1 - dy * dy;
  return q > 0 ? mass.rx * Math.sqrt(q) : 0;
}

/* The rule doc is the one disturbance running through every band. */
function schnittX(y) {
  return W * 0.655 + 34 * Math.sin(y * 0.0062 + phase * 0.5) + 12 * Math.sin(y * 0.017 - phase * 0.3);
}

function bandPfad(g, y0, h, ampl, k, ph, x1, x2) {
  g.beginPath();
  for (let x = x1; x <= x2; x += 4) {
    const yy = y0 + ampl * Math.sin(x * k + ph);
    x === x1 ? g.moveTo(x, yy) : g.lineTo(x, yy);
  }
  for (let x = x2; x >= x1; x -= 4) {
    g.lineTo(x, y0 + h + ampl * Math.sin(x * k + ph + 1.1));
  }
  g.closePath();
}

function beschriftung(d) {
  return d.zeilen + ' Zeilen' + (d.status ? ' · ' + d.status : '');
}

function malen() {
  if (!mass) return;
  mx.clearRect(0, 0, W, H);
  const { reihen, R, rx, cx, cy, horizont } = mass;

  /* the disc, built only from horizontal bands clipped to its outline */
  mx.save();
  mx.beginPath();
  mx.ellipse(cx, cy, rx, R, 0, 0, Math.PI * 2);
  mx.clip();
  reihen.forEach((r, i) => {
    const d = r.d;
    const hb = halbBreite(r.y + r.h / 2) + 6;
    const x1 = Math.max(-10, cx - hb), x2 = Math.min(W + 10, cx + hb);
    const ampl = AMPL[d.status] ?? 4;
    const k = 0.011 * (1 + i * 0.03);
    const ph = i * 1.7 + phase;
    mx.globalAlpha = aktiv === i ? 1 : 0.86;
    mx.fillStyle = 'rgb(' + TINTE + ')';
    bandPfad(mx, r.y, r.h, ampl, k, ph, x1, x2);
    mx.fill();
    mx.globalAlpha = 1;
  });
  mx.restore();

  /* the reflection: same order, compressed spacing, density as depth */
  reihen.forEach((r, i) => {
    const abstand = horizont - (r.y + r.h / 2);
    const yr = horizont + abstand * 0.42;
    if (yr > H + 40) return;
    const hr = Math.max(1.5, r.h * 0.6);
    const tiefe = 1 - Math.min(1, abstand / mass.platz);
    const grad = mx.createLinearGradient(cx - W * 0.62, 0, cx + W * 0.62, 0);
    const a = 0.16 + tiefe * 0.62;
    grad.addColorStop(0, 'rgba(' + TINTE + ',0)');
    grad.addColorStop(0.5, 'rgba(' + TINTE + ',' + a.toFixed(3) + ')');
    grad.addColorStop(1, 'rgba(' + TINTE + ',0)');
    mx.fillStyle = grad;
    const ampl = (AMPL[r.d.status] ?? 4) * 1.6 + 2;
    const k = 0.009 + i * 0.0006;
    const ph = -i * 1.7 - phase * 1.4;
    /* broken into segments: water, not glass */
    let x = -10;
    while (x < W + 10) {
      const luecke = Math.sin(x * 0.021 + i * 2.3) > 0.82;
      const bis = Math.min(W + 10, x + 26);
      if (!luecke) { bandPfad(mx, yr, hr, ampl, k, ph, x, bis); mx.fill(); }
      x = bis;
    }
  });

  /* the cut of the rules, carved out of everything above and below the horizon */
  if (REGEL) {
    mx.save();
    mx.globalCompositeOperation = 'destination-out';
    mx.beginPath();
    for (let y = mass.oben - 20; y <= H + 20; y += 6) mx.lineTo(schnittX(y) - 13, y);
    for (let y = H + 20; y >= mass.oben - 20; y -= 6) mx.lineTo(schnittX(y) + 13, y);
    mx.closePath();
    mx.fill();
    mx.restore();
  }

  /* quiet labels, also xor: red where they cross a band, off-white on the open ground */
  mx.save();
  mx.globalCompositeOperation = 'xor';
  mx.fillStyle = 'rgb(' + TINTE + ')';
  mx.textBaseline = 'middle';
  mx.textAlign = 'left';
  if ('letterSpacing' in mx) mx.letterSpacing = '0.14em';
  const spalte = Math.round(W * 0.045);
  reihen.forEach(r => {
    const d = r.d;
    const ym = Math.round(r.fachOben + r.fachHoehe / 2);
    /* the label hugs the left edge of the disc, so the column follows its curve */
    const lx = Math.round(Math.max(spalte, cx - halbBreite(r.y + r.h / 2) - 170));
    mx.font = '700 12px ui-monospace, monospace';
    mx.fillText(d.stamm.toUpperCase(), lx, ym - 8);
    mx.font = '400 11px ui-monospace, monospace';
    mx.fillText(beschriftung(d), lx, ym + 8);
  });
  if (REGEL) {
    const ry = mass.oben + 130;
    mx.translate(schnittX(ry), ry);
    mx.rotate(Math.PI / 2);
    mx.font = '700 12px ui-monospace, monospace';
    mx.fillText('REGELN   ' + REGEL.datei, 0, 0);
  }
  mx.restore();

  /* the word is part of the motif: xor knocks it out of the bands and prints it on the ground */
  mx.save();
  mx.globalCompositeOperation = 'xor';
  mx.fillStyle = 'rgb(' + TINTE + ')';
  if ('letterSpacing' in mx) mx.letterSpacing = '-0.045em';
  let groesse = 200;
  mx.font = '900 ' + groesse + 'px system-ui, sans-serif';
  const text = 'PROMPTOTYPING';
  const breit = mx.measureText(text).width;
  groesse = groesse * (W * 1.12) / breit;
  mx.font = '900 ' + groesse + 'px system-ui, sans-serif';
  mx.textBaseline = 'alphabetic';
  mx.fillText(text, -W * 0.06, H - H * 0.055);
  mx.restore();
}

/* Hitboxes are static and at least 44px high, independent of the moving waves. */
function griffeBauen() {
  griffe.innerHTML = '';
  mass.reihen.forEach((r, i) => {
    const d = r.d;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'band';
    const oben = Math.max(0, r.fachOben);
    b.style.cssText = 'left:0;width:100%;top:' + oben + 'px;height:' + Math.max(44, r.fachHoehe) + 'px';
    b.setAttribute('aria-label', d.stamm + ', ' + d.datei + ', ' + beschriftung(d));
    b.addEventListener('click', () => oeffnen(REIHENFOLGE.indexOf(d)));
    b.addEventListener('pointerenter', () => { aktiv = i; malen(); });
    b.addEventListener('pointerleave', () => { aktiv = -1; malen(); });
    b.addEventListener('focus', () => { aktiv = i; malen(); });
    b.addEventListener('blur', () => { aktiv = -1; malen(); });
    griffe.appendChild(b);
  });
  /* the rule doc gets its own hitbox: the vertical cut */
  if (!REGEL) return;
  const r = document.createElement('button');
  r.type = 'button';
  r.className = 'band';
  const xm = W * 0.655;
  r.style.cssText = 'left:' + (xm - 26) + 'px;width:52px;top:' + mass.oben + 'px;height:' + (H - mass.oben) + 'px';
  r.setAttribute('aria-label', REGEL.datei + ', schneidet durch alle Bänder');
  r.addEventListener('click', () => oeffnen(REIHENFOLGE.indexOf(REGEL)));
  griffe.appendChild(r);
}

/* Focus view: one word, the title, the numbers, the opening sentence. */
const fokus = document.getElementById('fokus');
let letzterGriff = null, jetzt = -1;

function oeffnen(i) {
  if (i < 0) return;
  jetzt = i;
  const d = REIHENFOLGE[i];
  if (!fokus.classList.contains('offen')) letzterGriff = document.activeElement;
  const wortEl = document.getElementById('wort');
  wortEl.textContent = d.stamm;
  /* the word is scaled radically: it fills the width, whatever its length */
  mess.font = '900 100px system-ui, sans-serif';
  const ziel = innerWidth * 0.9;
  const roh = mess.measureText(d.stamm.toUpperCase()).width;
  wortEl.style.fontSize = Math.min(100 * ziel / roh, innerHeight * 0.3) + 'px';
  document.getElementById('satz').textContent = d.titel;
  miniMalen(d);
  document.getElementById('zahlen').textContent =
    [d.datei, d.zeilen + ' Zeilen', d.status].filter(Boolean).join(' · ');
  document.getElementById('auszug').textContent = d.auszug || '';
  fokus.classList.add('offen');
  fokus.focus();
}

/* Formal miniature in the focus view: the whole disc, the open document's band lit. */
function miniMalen(d) {
  const m = document.getElementById('mini');
  const g = m.getContext('2d');
  const S = m.width, c = S / 2, r = S * 0.44;
  g.clearRect(0, 0, S, S);
  g.save();
  g.beginPath();
  g.arc(c, c, r, 0, Math.PI * 2);
  g.clip();
  BAENDER.forEach((b, i) => {
    const y0 = c - r + (i / BAENDER.length) * 2 * r;
    const h = (2 * r) / BAENDER.length;
    g.globalAlpha = b === d ? 1 : 0.3;
    g.fillStyle = 'rgb(' + TINTE + ')';
    g.fillRect(0, y0 + h * 0.2, S, h * 0.6);
  });
  /* the rule cut, lit when the rules are open */
  const regelOffen = REGEL && d === REGEL;
  g.globalAlpha = regelOffen ? 1 : 0.45;
  g.globalCompositeOperation = 'destination-out';
  g.fillRect(S * 0.62, 0, S * 0.07, S);
  g.restore();
  g.globalAlpha = 1;
  if (regelOffen) {
    g.fillStyle = 'rgb(' + TINTE + ')';
    g.fillRect(S * 0.635, c - r, S * 0.04, 2 * r);
  }
}

function schliessen() {
  fokus.classList.remove('offen');
  if (letzterGriff) letzterGriff.focus();
}
document.getElementById('zurueck-fokus').addEventListener('click', schliessen);
addEventListener('keydown', e => {
  if (!fokus.classList.contains('offen')) return;
  if (e.key === 'Escape') { schliessen(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); oeffnen((jetzt + 1) % REIHENFOLGE.length); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); oeffnen((jetzt - 1 + REIHENFOLGE.length) % REIHENFOLGE.length); }
});

let letzterKorn = 0;
function schlag(t) {
  phase += 0.0022;
  malen();
  if (t - letzterKorn > 240) { kornWeiter(); kornFuellen(kg, KW, KH); letzterKorn = t; }
  requestAnimationFrame(schlag);
}

addEventListener('resize', () => { messenHier(); kornFuellen(kg, KW, KH); });
messenHier();
kornBauen();
kornFuellen(kg, KW, KH);
if (!still) requestAnimationFrame(schlag);
</script>
</body>
</html>
