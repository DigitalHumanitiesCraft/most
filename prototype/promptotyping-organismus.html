<style>
/* Single-theme by design: anatomical night. All colors explicit. */
* { box-sizing: border-box; }

body {

canvas#adern { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  pointer-events: none;
  z-index: 3;
}
.kopf h1 {
  font-size: clamp(1.7rem, 4.5vw, 2.7rem);

  letter-spacing: .04em;
  text-shadow: 0 0 40px rgba(212,112,91,.35);
}
.kopf .sub { color: #9a8f96; font-size: clamp(.9rem, 2vw, 1.05rem); margin-top: .4rem; font-family: system-ui, sans-serif; }
#wahl {
  position: fixed;
  top: 4vh;
  left: 4vw;
  z-index: 4;
  display: flex;
  gap: .6rem;
}
#wahl button {
  font-family: Georgia, serif;
  font-size: 1rem;
  color: #9a8f96;
  background: none;
  border: 1.5px solid #3d2c34;
  border-radius: 2rem;
  padding: .45rem 1.2rem;
  cursor: pointer;
}
#wahl button.jetzt { color: #efe9d6; border-color: #d4705b; box-shadow: 0 0 18px rgba(212,112,91,.3); }
#wahl button:focus-visible { outline: 2px solid #efe9d6; }
#leib { position: fixed; inset: 0; z-index: 1; }
.organ {
  position: absolute;
  transform: translate(-50%, -50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #efe9d6;
  font-family: Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .15rem;
  padding: 14px;
  transition: filter .3s;
}
.organ:hover, .organ:focus-visible { filter: brightness(1.25); outline: none; }
.organ:focus-visible canvas { outline: 2px solid #efe9d6; outline-offset: 4px; border-radius: 50%; }
.organ .wort { font-size: clamp(1.05rem, 2.2vw, 1.4rem); letter-spacing: .04em; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.organ .datei { font-family: ui-monospace, monospace; font-size: .72rem; color: #9a8f96; }
.organ.geist .wort { color: #9a8f96; font-style: italic; }
#legende {
  position: fixed;
  bottom: 3.5vh;
  width: 100%;
  text-align: center;
  z-index: 3;
  pointer-events: none;
  font-family: system-ui, sans-serif;
  font-size: .88rem;
  color: #b9aeb4;
}
#legende b { color: #efe9d6; font-weight: 600; }
#lupe {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8vh 6vw;
  cursor: pointer;
  background: rgba(21, 13, 17, .93);
}
#lupe.offen { display: flex; }
#gross {
  font-size: clamp(3rem, 9vw, 5.5rem);
  line-height: 1.05;
  margin: 0;
  text-shadow: 0 0 70px var(--c1, rgba(212,112,91,.7));
  animation: auftauchen .6s ease both;
}
#frage {
  font-size: clamp(1.35rem, 3.2vw, 2rem);
  line-height: 1.4;
  max-width: 30ch;
  text-wrap: balance;
  margin: 1.8rem 0 0;
  color: #efe9d6;
  animation: auftauchen .6s .12s ease both;
}
#satz {
  font-family: system-ui, sans-serif;
  font-size: clamp(1rem, 2.2vw, 1.2rem);
  line-height: 1.6;
  max-width: 52ch;
  margin: 1.6rem 0 0;
  color: #b9aeb4;
  animation: auftauchen .6s .22s ease both;
}
#zahlen {
  font-family: ui-monospace, monospace;
  font-size: .85rem;
  color: #9a8f96;
  margin-top: 2.2rem;
  letter-spacing: .04em;
}
#schnitt {
  font-family: system-ui, sans-serif;
  font-size: .92rem;
  color: #d4705b;
  margin-top: 1rem;
  max-width: 50ch;
}
#lupe .hinweis { position: absolute; bottom: 4vh; font-family: system-ui, sans-serif; font-size: .85rem; color: #6b5f66; }
@keyframes auftauchen {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  #gross, #frage, #satz { animation: none; }
}

<canvas id="adern"></canvas>

<div id="wahl" role="group" aria-label="Exemplar wählen"></div>

<div class="kopf">
  <h1 id="titel"></h1>
  <p class="sub">Die Wissensbasis als Körper. Organe bewahren, Adern fließen, Nerven steuern.</p>
</div>

<div id="leib"></div>

<p id="legende"><b>Zelle</b> bleibendes Wissen · <b>rote Ader</b> die Zeit des Projekts · <b>feine Fäden</b> Regeln · <b>blass gestrichelt</b> fehlt, obwohl gebraucht</p>

<div id="lupe" aria-live="polite">
  <p id="gross"></p>
  <p id="frage"></p>
  <p id="satz"></p>
  <p id="zahlen"></p>
  <p id="schnitt"></p>
  <span class="hinweis">irgendwo tippen zum Zurückkehren</span>
</div>

<script>
/* organ = declarative knowledge, vene = process doc (node on the time vein),
   nerv = action doc (governs others), geist = triggered but missing */
const SPECIMENS = [
  { name: 'Promptotyping', organe: [
    { wort: 'Warum', frage: 'Was ist dieses Projekt, für wen, mit welchem Ziel?', satz: 'Die Charta der Methode, Forschungsdaten werden durch Context Engineering zu Forschungsartefakten.', datei: 'project.md', zeilen: 102, status: 'complete', schnitt: 'Aufschneiden, wenn der Output inhaltlich falsch ist oder der Projektkontext unklar.', art: 'organ', x: 22, y: 30, g: 1.1 },
    { wort: 'Wo', frage: 'Was liegt hier, und wie lese ich es?', satz: 'Der Wegweiser durch die dreizehn Wissensdokumente, mit dem Begriffslexikon.', datei: 'INDEX.md', zeilen: 108, status: 'complete', schnitt: 'Aufschneiden, wenn ein Dokument nicht gefunden oder ein Begriff falsch verwendet wird.', art: 'organ', x: 12, y: 56, g: .85 },
    { wort: 'Was', frage: 'Was soll das System tun, und warum?', satz: 'Anforderungen, Epics und Entscheidungen der Methoden-Website.', datei: 'specification.md', zeilen: 315, status: 'complete', schnitt: 'Aufschneiden, wenn ein Akzeptanzkriterium ignoriert oder eine alte Entscheidung neu aufgemacht wird.', art: 'organ', x: 38, y: 22, g: 1.2 },
    { wort: 'Wie', frage: 'Wie ist es technisch realisiert?', satz: 'Die statische Site und wie ihre Teile zusammenstecken.', datei: 'architecture.md', zeilen: 181, status: 'complete', schnitt: 'Aufschneiden bei falschen Annahmen über Komponenten und Datenfluss.', art: 'organ', x: 54, y: 36, g: 1 },
    { wort: 'Gestalt', frage: 'Wie sieht es aus, wie verhält es sich ästhetisch?', satz: 'Gestaltungsregeln und die ästhetische Haltung des Projekts.', datei: 'design.md', zeilen: 233, status: 'complete', schnitt: 'Aufschneiden bei UI-Inkonsistenz oder Designsystem-Bruch.', art: 'organ', x: 32, y: 52, g: 1 },
    { wort: 'Beweis', frage: 'Halten die eigenen Claims einer Prüfung stand?', satz: 'Adversariale Prüfung der empirischen Behauptungen für das Paper.', datei: 'verification.md', zeilen: 183, status: 'active', schnitt: 'Aufschneiden, wenn ein außenwirksamer Claim unbelegt ist.', art: 'organ', x: 68, y: 24, g: 1 },
    { wort: 'Stand', frage: 'Was ist der Stand zum Stichtag, für draußen?', satz: 'Der Bericht des ZfdG-Einreichungs-Durchgangs, ein eingefrorener Moment.', datei: 'report.md', zeilen: 113, status: 'snapshot', schnitt: 'Aufschneiden, wenn der kommunizierte Stand veraltet wirkt.', art: 'organ', x: 84, y: 38, g: .85 },
    { wort: 'Stoff', frage: 'Welches fachliche Wissen trägt das Projekt?', satz: 'Das Paper, sein kanonisches Wissensdokument und zwei Video-Skripten, zusammen fast dreitausend Zeilen.', datei: 'paper.md +3', zeilen: 2826, status: 'draft', schnitt: 'Aufschneiden, wenn eine Fachregel oder die Argumentation des Papers verletzt wird.', art: 'organ', x: 46, y: 68, g: 1.35 },
    { wort: 'Woher', frage: 'Wie sind wir hierhin gekommen?', satz: '867 Zeilen Projektgedächtnis, rückwärts gelesen die ganze Geschichte.', datei: 'journal.md', zeilen: 867, status: 'active', schnitt: 'Aufschneiden bei unklarer Entscheidungslogik und wiederholten Sackgassen.', art: 'vene', x: 64, y: 56, g: 1 },
    { wort: 'Wohin', frage: 'Wohin geht es, in welcher Reihenfolge?', satz: 'Die Vorwärtsrichtung, Phasen und nächste Schritte.', datei: 'plan.md', zeilen: 152, status: 'active', schnitt: 'Aufschneiden, wenn der nächste Schritt nicht erkennbar ist.', art: 'vene', x: 78, y: 66, g: .9 },
    { wort: 'Regeln', frage: 'Wie soll der Agent sich verhalten?', satz: 'Die Verhaltensregeln im Repo-Root, sie feuern in alles hinein, was gebaut wird.', datei: 'CLAUDE.md', zeilen: null, status: 'active', schnitt: 'Aufschneiden bei Stilbruch oder ignorierten Verboten.', art: 'nerv', x: 88, y: 16, g: .9 },
    { wort: 'Daten', frage: 'Was ist das verarbeitete Substrat?', satz: 'Das Repo trägt einen data-Ordner, aber kein Dokument beschreibt ihn. Der Trigger ist erfüllt, das Organ fehlt.', datei: 'data.md fehlt', zeilen: null, status: 'geist', schnitt: 'Anlegen, bevor Datenfelder verwechselt oder Beispiele falsch zitiert werden.', art: 'organ', geist: true, x: 20, y: 78, g: .9 },
    { wort: 'Prüfung', frage: 'Was wird garantiert, und wie wird es geprüft?', satz: 'Es gibt Werkzeuge, aber keine beschriebenen Garantien. Der Trigger ist erfüllt, das Organ fehlt.', datei: 'testing.md fehlt', zeilen: null, status: 'geist', schnitt: 'Anlegen, bevor eine Garantie unklar wird.', art: 'organ', geist: true, x: 66, y: 80, g: .9 },
  ]},
  { name: 'most', organe: [
    { wort: 'Warum', frage: 'Was ist dieses Projekt, für wen, mit welchem Ziel?', satz: 'Idee, Designprinzipien, sechs Personas und die Simulationsmethode.', datei: 'projekt.md', zeilen: 38, status: 'active', schnitt: 'Aufschneiden, wenn der Projektkontext unklar wird.', art: 'organ', x: 34, y: 38, g: 1.1 },
    { wort: 'Stoff', frage: 'Welches fachliche Wissen trägt das Projekt?', satz: 'Die Empirie, wie Menschen unter akuter Wirkung wirklich kommunizieren, mit Quellen.', datei: 'grounding-kommunikation.md', zeilen: 34, status: 'active', schnitt: 'Aufschneiden, bevor eine Persona wieder zu glatt spricht.', art: 'organ', x: 58, y: 44, g: 1 },
    { wort: 'Was', frage: 'Was soll das UI können, und warum?', satz: 'Vier Prototypen existieren, aber was sie können sollen, steht nirgends fest. Der Trigger ist erfüllt, das Organ fehlt.', datei: 'specification.md fehlt', zeilen: null, status: 'geist', schnitt: 'Anlegen, bevor der nächste Prototyp das Ziel rät.', art: 'organ', geist: true, x: 24, y: 62, g: 1 },
    { wort: 'Woher', frage: 'Wie sind wir hierhin gekommen?', satz: 'Das Projekt hat schon eine Geschichte, fünf Commits, zwei Personas, einen Stilstreit, aber kein Gedächtnis.', datei: 'journal.md fehlt', zeilen: null, status: 'geist', schnitt: 'Anlegen, bevor sich die erste Sackgasse wiederholt.', art: 'vene', geist: true, x: 48, y: 68, g: 1 },
    { wort: 'Gestalt', frage: 'Wie sieht es aus, wie verhält es sich?', satz: 'Die Bildsprache aus Zellen und Adern lebt nur im Prototyp, nicht als Dokument.', datei: 'design.md fehlt', zeilen: null, status: 'geist', schnitt: 'Anlegen, bevor der nächste Prototyp die Sprache bricht.', art: 'organ', geist: true, x: 70, y: 62, g: .95 },
    { wort: 'Regeln', frage: 'Wie soll der Agent sich verhalten?', satz: 'Der Agent improvisiert noch ohne projekteigene Regeln.', datei: 'CLAUDE.md fehlt', zeilen: null, status: 'geist', schnitt: 'Anlegen, sobald sich Konventionen wiederholen.', art: 'nerv', geist: true, x: 78, y: 26, g: .85 },
  ]},
];

const leib = document.getElementById('leib');
const wahl = document.getElementById('wahl');
const lupe = document.getElementById('lupe');
let exemplar = SPECIMENS.find(s => '#' + s.name.toLowerCase() === location.hash.toLowerCase()) || SPECIMENS[0];

let seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

function zelle(size, c1, c2, kerne, geist) {
  const dpr = 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * dpr;
  c.style.width = c.style.height = size + 'px';
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const m = size / 2, r = size * .36;
  const p1 = rnd() * 7, p2 = rnd() * 7;
  g.beginPath();
  for (let i = 0; i <= 90; i++) {
    const a = i / 90 * Math.PI * 2;
    const w = r * (1 + .09 * Math.sin(3 * a + p1) + .05 * Math.sin(7 * a + p2));
    i ? g.lineTo(m + Math.cos(a) * w, m + Math.sin(a) * w) : g.moveTo(m + Math.cos(a) * w, m + Math.sin(a) * w);
  }
  g.closePath();
  if (geist) {
    g.setLineDash([5, 6]);
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(154,143,150,.75)';
    g.stroke();
    g.setLineDash([]);
    g.fillStyle = 'rgba(154,143,150,.6)';
    g.beginPath(); g.arc(m, m, r * .16, 0, 7); g.stroke();
  } else {
    const grad = g.createRadialGradient(m - r * .25, m - r * .3, r * .1, m, m, r * 1.15);
    grad.addColorStop(0, '#fdf3ec');
    grad.addColorStop(.45, c1);
    grad.addColorStop(1, c2);
    g.shadowColor = c1; g.shadowBlur = size * .15;
    g.fillStyle = grad;
    g.fill();
    g.shadowBlur = 0;
    g.lineWidth = 1.5; g.strokeStyle = c2; g.stroke();
    const nr = kerne === 1 ? 0 : r * .5;
    for (let k = 0; k < kerne; k++) {
      const a = k / kerne * Math.PI * 2 + p1;
      const x = m + Math.cos(a) * nr, y = m + Math.sin(a) * nr;
      const kr = Math.max(2.5, r * (kerne === 1 ? .28 : .12));
      g.fillStyle = '#3d1220';
      g.beginPath(); g.arc(x, y, kr, 0, 7); g.fill();
    }
  }
  return c;
}

const FARBEN = { organ: ['#d9c184', '#6e5c2c'], vene: ['#d4705b', '#6e2438'], nerv: ['#a9b7c6', '#46525e'] };

function bauen() {
  leib.innerHTML = '';
  document.getElementById('titel').textContent = exemplar.name;
  for (const o of exemplar.organe) {
    const b = document.createElement('button');
    b.className = 'organ' + (o.geist ? ' geist' : '');
    b.style.left = o.x + '%';
    b.style.top = o.y + '%';
    const size = Math.round(72 * o.g);
    const [c1, c2] = FARBEN[o.art];
    /* nuclei count = documents behind the organ (Stoff bundles several) */
    const kerne = o.datei.includes('+') ? 4 : 1;
    b.appendChild(zelle(size, c1, c2, kerne, o.geist));
    const w = document.createElement('span');
    w.className = 'wort'; w.textContent = o.wort;
    const d = document.createElement('span');
    d.className = 'datei'; d.textContent = o.datei;
    b.append(w, d);
    b.addEventListener('click', () => oeffnen(o));
    leib.appendChild(b);
  }
  malen();
}

function oeffnen(o) {
  const [c1] = FARBEN[o.art];
  lupe.style.setProperty('--c1', c1);
  document.getElementById('gross').textContent = o.wort;
  document.getElementById('frage').textContent = o.frage;
  document.getElementById('satz').textContent = o.satz;
  document.getElementById('zahlen').textContent =
    [o.datei, o.zeilen ? o.zeilen + ' Zeilen' : null, o.status].filter(Boolean).join(' · ');
  document.getElementById('schnitt').textContent = o.schnitt;
  for (const el of ['gross', 'frage', 'satz'].map(id => document.getElementById(id))) {
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  }
  lupe.classList.add('offen');
}
lupe.addEventListener('click', () => lupe.classList.remove('offen'));
addEventListener('keydown', e => { if (e.key === 'Escape') lupe.classList.remove('offen'); });

SPECIMENS.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s.name;
  if (s === exemplar) b.classList.add('jetzt');
  b.addEventListener('click', () => {
    exemplar = s;
    [...wahl.children].forEach(k => k.classList.toggle('jetzt', k === b));
    bauen();
  });
  wahl.appendChild(b);
});

/* the vein of time through the process nodes, and nerve threads from the rule node */
const cv = document.getElementById('adern');
const cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, puls = 0;
function messen() { W = cv.width = innerWidth; H = cv.height = innerHeight; malen(); }
addEventListener('resize', messen);

function malen() {
  if (!W) { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  cx.clearRect(0, 0, W, H);
  const px = o => o.x / 100 * W, py = o => o.y / 100 * H;
  const venen = exemplar.organe.filter(o => o.art === 'vene');
  const nerv = exemplar.organe.find(o => o.art === 'nerv');
  const organe = exemplar.organe.filter(o => o.art === 'organ');
  /* vein enters bottom-left (the past), passes every vein node, leaves right (the future) */
  if (venen.length) {
    cx.beginPath();
    cx.moveTo(-40, H * .95);
    let vor = { x: -40, y: H * .95 };
    for (const v of venen) {
      const mx = (vor.x + px(v)) / 2;
      cx.quadraticCurveTo(mx, py(v) + 60, px(v), py(v));
      vor = { x: px(v), y: py(v) };
    }
    cx.quadraticCurveTo(W * .95, vor.y - 80, W + 40, H * .3);
    cx.strokeStyle = 'rgba(212,112,91,.5)';
    cx.lineWidth = 7;
    cx.lineCap = 'round';
    cx.shadowColor = '#d4705b'; cx.shadowBlur = 18;
    if (!still) { cx.setLineDash([26, 14]); cx.lineDashOffset = -puls; }
    cx.stroke();
    cx.setLineDash([]); cx.shadowBlur = 0;
  }
  /* nerve threads from the rule node into what it governs */
  if (nerv) {
    cx.strokeStyle = 'rgba(169,183,198,.28)';
    cx.lineWidth = 1.2;
    cx.setLineDash([2, 5]);
    for (const o of organe.filter(o => !o.geist)) {
      cx.beginPath();
      cx.moveTo(px(nerv), py(nerv));
      cx.quadraticCurveTo((px(nerv) + px(o)) / 2, (py(nerv) + py(o)) / 2 - 40, px(o), py(o));
      cx.stroke();
    }
    cx.setLineDash([]);
  }
}
function tick() {
  puls += .35;
  malen();
  requestAnimationFrame(tick);
}
messen();
if (still) malen(); else tick();
bauen();
</script>
